<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1360" width="1000" height="1360" role="img" aria-labelledby="t d">
<title id="t">Settlement step III sequence</title>
<desc id="d">Keeper calls execute_step, the contract builds an omni transaction, requests a signature from v1.signer through a yield, stores the signed transaction in the callback, the keeper relays it and calls mark_broadcast, which verifies the hash.</desc>
<style>/*STYLE*/</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#C8A96A" stroke-width="1.5"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#A9A399" stroke-width="1.5"/></marker>
</defs>
<rect width="1000" height="1360" fill="#0B0C0F"/>
<text x="30" y="58" class="title">Step III, <tspan class="it">one payout per call</tspan></text>
<text x="30" y="84" class="b2">How a foreign payout is signed and then proven relayed. Dashed arrows are returns and callbacks.</text>
<line x1="30" y1="100" x2="970" y2="100" class="hair"/>
<line x1="105" y1="170" x2="105" y2="1290" stroke="rgba(237,231,220,.22)" stroke-dasharray="3 5"/><line x1="320" y1="170" x2="320" y2="1290" stroke="rgba(237,231,220,.22)" stroke-dasharray="3 5"/><line x1="525" y1="170" x2="525" y2="1290" stroke="rgba(237,231,220,.22)" stroke-dasharray="3 5"/><line x1="725" y1="170" x2="725" y2="1290" stroke="rgba(237,231,220,.22)" stroke-dasharray="3 5"/><line x1="905" y1="170" x2="905" y2="1290" stroke="rgba(237,231,220,.22)" stroke-dasharray="3 5"/>
<rect x="40" y="122" width="130" height="48" class="panel" rx="4"/><text x="105" y="144" text-anchor="middle" class="hs" style="font-size:20px">Keeper</text><text x="105" y="161" text-anchor="middle" class="m mg" style="font-size:11px">off-chain CLI</text><rect x="255" y="122" width="130" height="48" class="panel" rx="4"/><text x="320" y="144" text-anchor="middle" class="hs" style="font-size:20px">dmw contract</text><text x="320" y="161" text-anchor="middle" class="m mg" style="font-size:11px">dmw-x8cx.testnet</text><rect x="460" y="122" width="130" height="48" class="panel" rx="4"/><text x="525" y="144" text-anchor="middle" class="hs" style="font-size:20px">omni-transaction</text><text x="525" y="161" text-anchor="middle" class="m mg" style="font-size:11px">in-contract lib</text><rect x="660" y="122" width="130" height="48" class="panel" rx="4"/><text x="725" y="144" text-anchor="middle" class="hs" style="font-size:20px;font-family:Inter Tight;font-weight:500;font-size:17px">v1.signer</text><text x="725" y="161" text-anchor="middle" class="m mg" style="font-size:11px">MPC network</text><rect x="840" y="122" width="130" height="48" class="panel" rx="4"/><text x="905" y="144" text-anchor="middle" class="hs" style="font-size:20px">Foreign chain</text><text x="905" y="161" text-anchor="middle" class="m mg" style="font-size:11px">Base Sol Monad</text>
<path d="M105 226 H905" stroke="#A9A399" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<rect x="371" y="205" width="267" height="18" fill="#0B0C0F"/>
<text x="505.0" y="218" text-anchor="middle" class="m"><tspan class="mb" style="fill:#8C7446">1</tspan>  <tspan style="fill:#A9A399">read fee data and a blockhash</tspan></text>
<rect x="404" y="231" width="202" height="18" fill="#0B0C0F"/>
<text x="505.0" y="244" text-anchor="middle" class="sm">read-only RPC before the call</text>
<path d="M105 281 H320" stroke="#C8A96A" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="83" y="260" width="259" height="18" fill="#0B0C0F"/>
<text x="212.5" y="273" text-anchor="middle" class="m"><tspan class="mb" style="fill:#8C7446">2</tspan>  <tspan style="fill:#C8A96A">execute_step(token_id, args)</tspan></text>
<rect x="64" y="286" width="296" height="18" fill="#0B0C0F"/>
<text x="212.5" y="299" text-anchor="middle" class="sm">300 TGas. args hold chain environment only,</text>
<rect x="128" y="303" width="169" height="18" fill="#0B0C0F"/>
<text x="212.5" y="316" text-anchor="middle" class="sm">never to, value or chain</text>
<rect x="175" y="353" width="290" height="69" class="panel" rx="4"/>
<text x="187" y="375" class="sm" style="fill:#EDE7DC">Needs Triggered, step III, nothing in flight.</text>
<text x="187" y="392" class="sm" style="fill:#EDE7DC">EVM: gas 21000 to 100000, fee ≤ 100 gwei.</text>
<text x="187" y="409" class="sm" style="fill:#EDE7DC">Nonce is set by the contract.</text>
<path d="M320 456 H525" stroke="#C8A96A" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="317" y="435" width="212" height="18" fill="#0B0C0F"/>
<text x="422.5" y="448" text-anchor="middle" class="m"><tspan class="mb" style="fill:#8C7446">3</tspan>  <tspan style="fill:#C8A96A">build_tx(payout, args)</tspan></text>
<rect x="311" y="461" width="222" height="18" fill="#0B0C0F"/>
<text x="422.5" y="474" text-anchor="middle" class="sm">to, value, chain from the vault;</text>
<rect x="325" y="478" width="196" height="18" fill="#0B0C0F"/>
<text x="422.5" y="491" text-anchor="middle" class="sm">fees and blockhash from args</text>
<path d="M525 528 H320" stroke="#A9A399" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<rect x="344" y="507" width="156" height="18" fill="#0B0C0F"/>
<text x="422.5" y="520" text-anchor="middle" class="m"><tspan class="mb" style="fill:#8C7446">4</tspan>  <tspan style="fill:#A9A399">payload to sign</tspan></text>
<rect x="338" y="533" width="169" height="18" fill="#0B0C0F"/>
<text x="422.5" y="546" text-anchor="middle" class="sm">EIP-1559: keccak256 hash</text>
<rect x="348" y="550" width="149" height="18" fill="#0B0C0F"/>
<text x="422.5" y="563" text-anchor="middle" class="sm">Solana: message bytes</text>
<path d="M320 600 H725" stroke="#C8A96A" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="357" y="579" width="330" height="18" fill="#0B0C0F"/>
<text x="522.5" y="592" text-anchor="middle" class="m"><tspan class="mb" style="fill:#8C7446">5</tspan>  <tspan style="fill:#C8A96A">sign({ payload_v2, path, domain_id })</tspan></text>
<rect x="384" y="605" width="276" height="18" fill="#0B0C0F"/>
<text x="522.5" y="618" text-anchor="middle" class="sm">path base-N or sol-N. 250 TGas, 1 yocto.</text>
<rect x="378" y="622" width="289" height="18" fill="#0B0C0F"/>
<text x="522.5" y="635" text-anchor="middle" class="sm">The call yields; no key exists before this</text>
<rect x="575" y="672" width="300" height="69" class="panel" rx="4"/>
<text x="587" y="694" class="sm" style="fill:#EDE7DC">The MPC nodes sign with the derived key.</text>
<text x="587" y="711" class="sm" style="fill:#EDE7DC">The yield resumes. Pending over 10 min</text>
<text x="587" y="728" class="sm" style="fill:#EDE7DC">is marked failed and settlement moves on.</text>
<path d="M725 775 H320" stroke="#A9A399" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<rect x="393" y="754" width="259" height="18" fill="#0B0C0F"/>
<text x="522.5" y="767" text-anchor="middle" class="m"><tspan class="mb" style="fill:#8C7446">6</tspan>  <tspan style="fill:#A9A399">on_foreign_signed(signature)</tspan></text>
<rect x="388" y="780" width="269" height="18" fill="#0B0C0F"/>
<text x="522.5" y="793" text-anchor="middle" class="sm">30 TGas callback. A stale or superseded</text>
<rect x="458" y="797" width="129" height="18" fill="#0B0C0F"/>
<text x="522.5" y="810" text-anchor="middle" class="sm">request is ignored</text>
<rect x="175" y="847" width="290" height="69" class="panel" rx="4"/>
<text x="187" y="869" class="sm" style="fill:#EDE7DC">Builds the signed tx, stores signed_tx.</text>
<text x="187" y="886" class="sm" style="fill:#EDE7DC">status = signed, next payout.</text>
<text x="187" y="903" class="sm" style="fill:#EDE7DC">A failed MPC call: status = failed.</text>
<path d="M320 950 H105" stroke="#A9A399" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<rect x="162" y="929" width="101" height="18" fill="#0B0C0F"/>
<text x="212.5" y="942" text-anchor="middle" class="m"><tspan class="mb" style="fill:#8C7446">7</tspan>  <tspan style="fill:#A9A399">new step</tspan></text>
<rect x="58" y="955" width="310" height="18" fill="#0B0C0F"/>
<text x="212.5" y="968" text-anchor="middle" class="sm">the callback returns it. III repeats for each</text>
<rect x="158" y="972" width="108" height="18" fill="#0B0C0F"/>
<text x="212.5" y="985" text-anchor="middle" class="sm">payout, then IV</text>
<path d="M105 1022 H905" stroke="#C8A96A" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="395" y="1001" width="220" height="18" fill="#0B0C0F"/>
<text x="505.0" y="1014" text-anchor="middle" class="m"><tspan class="mb" style="fill:#8C7446">8</tspan>  <tspan style="fill:#C8A96A">relay the raw signed tx</tspan></text>
<rect x="367" y="1027" width="276" height="18" fill="#0B0C0F"/>
<text x="505.0" y="1040" text-anchor="middle" class="sm">eth_sendRawTransaction · sendTransaction</text>
<path d="M905 1077 H105" stroke="#A9A399" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<rect x="458" y="1056" width="93" height="18" fill="#0B0C0F"/>
<text x="505.0" y="1069" text-anchor="middle" class="m"><tspan class="mb" style="fill:#8C7446">9</tspan>  <tspan style="fill:#A9A399">tx hash</tspan></text>
<path d="M105 1115 H320" stroke="#C8A96A" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="47" y="1094" width="330" height="18" fill="#0B0C0F"/>
<text x="212.5" y="1107" text-anchor="middle" class="m"><tspan class="mb" style="fill:#8C7446">10</tspan>  <tspan style="fill:#C8A96A">mark_broadcast(token_id, index, hash)</tspan></text>
<rect x="162" y="1120" width="102" height="18" fill="#0B0C0F"/>
<text x="212.5" y="1133" text-anchor="middle" class="sm">permissionless</text>
<rect x="148" y="1170" width="345" height="86" class="panel" rx="4"/>
<text x="160" y="1192" class="sm" style="fill:#EDE7DC">Recomputes the id from the stored signed_tx.</text>
<text x="160" y="1209" class="sm" style="fill:#EDE7DC">EVM: 0x + keccak256(raw tx).</text>
<text x="160" y="1226" class="sm" style="fill:#EDE7DC">Solana: base58 of the first signature.</text>
<text x="160" y="1243" class="sm" style="fill:#EDE7DC">A wrong hash panics. Right hash: status = broadcast.</text>
<line x1="30" y1="1308" x2="970" y2="1308" class="hair"/>
<text x="30" y="1336" class="sm">The keeper never supplies a destination, an amount or a chain. A signature is requested only after Triggered. Testnet only.</text>
</svg>
