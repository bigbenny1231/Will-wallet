name: testnet

# Manual testnet jobs that need the open internet (NEAR RPC, the faucet, Chain Signatures). Run from the Actions tab
# or the API (workflow_dispatch). Nothing here runs on push.
#
#   task=all      fresh contract account, deploy contracts/release/dmw.wasm, init, set_keeper, showcase vault, then
#                 LOCK the contract (its full-access key is deleted), the live checks (contracts/smoke.sh,
#                 contracts/attack-c2.sh), and the demo video (docs/video/tools/v4)
#   task=verify   only the live checks, on `contract`
#   task=record   only the demo video, on `contract`
#   task=finish   the C-2 attack check and the demo video, on `contract` (an `all` run that stopped after the smoke test)
#   task=edit     re-edit the video from the raw footage of an earlier record run (`raw_run`), no chain access
#   task=release  only the reproducible build below, no chain access
#
# `all` and `release` first make a reproducible build (`cargo near build reproducible-wasm` in the Docker image pinned
# in contracts/dmw/Cargo.toml) of the dispatched commit and commit it to the same branch as contracts/release/dmw.wasm,
# so the deployed code hash is checkable by anyone from the source commit named in that commit's message.
#
# Keys. No key leaves the runner. The contract keeper is the long-lived account derived from the KEEPER_SEED repository
# secret (scripts/near-admin.mjs derive-keeper): the same account the scheduled keeper (keeper.yml) signs with, so it
# keeps settling vaults after this run ends. Every other account is a throwaway testnet faucet account. All keys live
# only in this job's keys/ folder and are masked in the log the moment they exist (scripts/ci/mask.sh). The contract account
# keeps no full-access key after setup, so nobody (this workflow included) can change its code afterwards; a fix is a
# fresh deploy. Non-secret results (tx links, logs, video, stills) are pushed to the branch `ci/testnet-results` under
# results/<run id>/, after a check that no private key is among them.
on:
  workflow_dispatch:
    inputs:
      task:
        description: all | verify | record | finish | edit | release
        required: true
        default: all
      contract:
        description: contract account for verify and record (e.g. dmw-abc123.testnet)
        required: false
        default: ''
      raw_run:
        description: run id of the record run whose raw footage to re-edit (edit)
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: testnet
  cancel-in-progress: false

jobs:
  testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEAR_NETWORK: testnet
      NEAR_RPC: https://rpc.testnet.fastnear.com
      TERM: dumb
      NO_COLOR: '1'
      OUT: ${{ github.workspace }}/results/${{ github.run_id }}
      # saved logs never keep workflow-command lines (a mask line carries the key it masks)
      SAVE: grep --line-buffered -v '^::'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Install keeper and agent dependencies
        run: |
          (cd keeper && npm ci --no-audit --no-fund --loglevel=error)
          (cd agent && npm ci --no-audit --no-fund --loglevel=error)
          mkdir -p "$OUT"

      - name: The long-lived keeper secret is set
        if: inputs.task == 'all' || inputs.task == 'record' || inputs.task == 'finish'
        env:
          KEEPER_SEED: ${{ secrets.KEEPER_SEED }}
        run: |
          if [ "${#KEEPER_SEED}" -lt 32 ]; then
            echo "::error::Repository secret KEEPER_SEED is missing or shorter than 32 characters (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "KEEPER_SEED is set (${#KEEPER_SEED} characters)"

      # ---------------- release build ----------------
      - name: Reproducible release build, committed to this branch
        if: inputs.task == 'release' || inputs.task == 'all'
        run: |
          set -o pipefail
          case "$GITHUB_REF" in refs/heads/*) ;; *) echo "dispatch release on a branch"; exit 1;; esac
          SRC=$(git rev-parse HEAD)
          # cargo-near 0.23.0 installer, pinned by its sha256 (the installer in turn checks the binary's sha256)
          curl --proto '=https' --tlsv1.2 -LsSf -o /tmp/cargo-near-installer.sh https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh
          echo "76ae71bc6a99864a09cc67c1c0bf82a2b7812d8ab4c93034b680235df6d22028  /tmp/cargo-near-installer.sh" | sha256sum -c -
          sh /tmp/cargo-near-installer.sh
          cargo near --version
          (cd contracts/dmw && cargo near build reproducible-wasm) 2>&1 | tee >(eval "$SAVE" > "$OUT/release-build.log")
          cp contracts/dmw/target/near/dmw.wasm contracts/release/dmw.wasm
          H=$(node -e 'const b=require("crypto").createHash("sha256").update(require("fs").readFileSync(process.argv[1])).digest();const A="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";let n=BigInt("0x"+b.toString("hex")),s="";while(n>0n){s=A[Number(n%58n)]+s;n/=58n}for(const x of b){if(x!==0)break;s="1"+s}console.log(s)' contracts/release/dmw.wasm)
          echo "source $SRC  code hash $H  $(wc -c < contracts/release/dmw.wasm) bytes" | tee -a "$OUT/release-build.log"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/release/dmw.wasm
          if git diff --cached --quiet; then echo "release wasm already matches this build"; else
            git commit -qm "release: reproducible build of $SRC (code hash $H)" && git push -q origin "HEAD:$GITHUB_REF_NAME"; fi

      - name: Contract from the input
        if: inputs.task == 'verify' || inputs.task == 'record' || inputs.task == 'finish'
        env:
          CONTRACT_INPUT: ${{ inputs.contract }}
        run: |
          case "$CONTRACT_INPUT" in *.testnet) ;; *) echo "contract input must be a .testnet account"; exit 1;; esac
          case "$CONTRACT_INPUT" in *[!a-z0-9._-]*) echo "contract input has invalid characters"; exit 1;; esac
          printf 'NEAR_NETWORK=testnet\nDMW_CONTRACT=%s\n' "$CONTRACT_INPUT" > .env; chmod 600 .env

      # ---------------- deploy ----------------
      - name: Deploy the release build to a fresh account
        if: inputs.task == 'all'
        env:
          KEEPER_SEED: ${{ secrets.KEEPER_SEED }}
          REQUIRE_KEEPER_SEED: '1'
        run: |
          set -o pipefail
          # mask each key the moment it exists: run deploy.sh with a watcher that masks new key files
          ( while sleep 0.2; do ./scripts/ci/mask.sh; done ) & W=$!
          NEW=1 DMW_WASM=contracts/release/dmw.wasm ./scripts/deploy.sh 2>&1 | tee >(eval "$SAVE" > "$OUT/deploy.log")
          kill $W || true; ./scripts/ci/mask.sh
          C=$(sed -n 's/^DMW_CONTRACT=//p' .env); echo "C=$C" >> "$GITHUB_ENV"
          node scripts/near-admin.mjs view "$C" contract_source_metadata '{}' | tee >(eval "$SAVE" >> "$OUT/deploy.log") || true
          curl -s "$NEAR_RPC" -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"query\",\"params\":{\"request_type\":\"view_account\",\"finality\":\"final\",\"account_id\":\"$C\"}}" \
            | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")).result; console.log("on-chain code_hash", r.code_hash)' | tee >(eval "$SAVE" >> "$OUT/deploy.log")
          sha256sum contracts/release/dmw.wasm | tee >(eval "$SAVE" >> "$OUT/deploy.log")
      - name: Showcase vault
        if: inputs.task == 'all'
        env:
          KEEPER_SEED: ${{ secrets.KEEPER_SEED }}
        run: |
          set -o pipefail
          ( while sleep 0.2; do ./scripts/ci/mask.sh; done ) & W=$!
          ./scripts/showcase.sh 2>&1 | tee >(eval "$SAVE" > "$OUT/showcase.log")
          kill $W || true; ./scripts/ci/mask.sh
          cp .demo/showcase.json "$OUT/"
      - name: Lock the contract (delete its full-access key)
        if: inputs.task == 'all'
        run: |
          set -o pipefail
          C=$(sed -n 's/^DMW_CONTRACT=//p' .env); K=$(sed -n 's/^KEEPER_ACCOUNT_ID=//p' .env)
          # The lock is irreversible, so first check the contract keeper is the long-lived account (review H-2)
          CK=$(node scripts/near-admin.mjs view "$C" get_config '{}' | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).keeper||"")')
          echo "contract keeper: $CK (expected $K)" | tee >(eval "$SAVE" > "$OUT/lock.log")
          [ -n "$K" ] && [ "$CK" = "$K" ] || { echo "::error::contract keeper is not the long-lived keeper; not locking"; exit 1; }
          node scripts/near-admin.mjs keys "$K" | grep -q '"public_key"' || { echo "::error::$K has no access key; not locking"; exit 1; }
          node scripts/near-admin.mjs lock "$C" 2>&1 | tee >(eval "$SAVE" >> "$OUT/lock.log")
          node scripts/near-admin.mjs keys "$C" | tee >(eval "$SAVE" >> "$OUT/lock.log")
          rm -f "keys/$C.json"

      # ---------------- live checks ----------------
      - name: Smoke test (create vault, heartbeat, agent allowed and denied, trigger, five steps, claim)
        if: inputs.task == 'all' || inputs.task == 'verify'
        run: |
          set -o pipefail
          C=$(sed -n 's/^DMW_CONTRACT=//p' .env); S=$(openssl rand -hex 2)
          for a in dmw-smoke-owner-$S dmw-smoke-h1-$S dmw-smoke-h2-$S; do node scripts/near-admin.mjs create $a.testnet; done
          ./scripts/ci/mask.sh; sleep 4
          ./contracts/smoke.sh "$C" dmw-smoke-owner-$S.testnet dmw-smoke-h1-$S.testnet dmw-smoke-h2-$S.testnet 2>&1 | tee >(eval "$SAVE" > "$OUT/smoke.log")
      - name: C-2 drain attempt (attacker DAO keeps the bond; the vault must not be credited twice)
        if: inputs.task == 'all' || inputs.task == 'verify' || inputs.task == 'finish'
        run: |
          set -o pipefail
          C=$(sed -n 's/^DMW_CONTRACT=//p' .env); A=dmw-att-$(openssl rand -hex 2).testnet
          # one faucet account; the heir and the "DAO" are its sub-accounts (the faucet allows ~10 accounts per IP per 12 h)
          node scripts/near-admin.mjs create $A; ./scripts/ci/mask.sh
          for _ in $(seq 15); do node scripts/near-admin.mjs keys $A >/dev/null 2>&1 && break; sleep 2; done
          node scripts/near-admin.mjs sub $A heir 0.5; node scripts/near-admin.mjs sub $A dao 1.5; ./scripts/ci/mask.sh; sleep 3
          ./contracts/attack-c2.sh "$C" $A heir.$A dao.$A 2>&1 | tee >(eval "$SAVE" > "$OUT/attack-c2.log")

      - name: Leave a vault for the scheduled keeper (nothing in this run drives it)
        if: inputs.task == 'all'
        run: |
          set -o pipefail
          C=$(sed -n 's/^DMW_CONTRACT=//p' .env)
          ./scripts/ci/sentinel.sh "$C" 2>&1 | tee >(eval "$SAVE" > "$OUT/sentinel.log")

      # ---------------- video ----------------
      - name: Video tools (ffmpeg, Playwright Chromium, dashboard build)
        if: ${{ !cancelled() && (inputs.task == 'all' || inputs.task == 'record' || inputs.task == 'finish' || inputs.task == 'edit') }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.63.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          echo "PW_MODULE=/tmp/pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE/dashboard" && npm ci --no-audit --no-fund --loglevel=error
      - name: Raw footage from the record run
        if: inputs.task == 'edit'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dmw-raw, path: /tmp/v4, run-id: '${{ inputs.raw_run }}', github-token: '${{ github.token }}' }
      - name: Record the demo run
        if: ${{ !cancelled() && (inputs.task == 'all' || inputs.task == 'record' || inputs.task == 'finish') }}
        env:
          KEEPER_SEED: ${{ secrets.KEEPER_SEED }}
          REQUIRE_KEEPER_SEED: '1'
        run: |
          set -o pipefail
          ( while sleep 0.2; do ./scripts/ci/mask.sh; done ) & W=$!
          ./docs/video/tools/v4/record.sh 2>&1 | tee >(eval "$SAVE" > "$OUT/record.log")
          kill $W || true
      - if: (inputs.task == 'all' || inputs.task == 'record' || inputs.task == 'finish') && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: dmw-raw, path: /tmp/v4/raw-pack, retention-days: 30, if-no-files-found: ignore }
      - name: Edit
        if: ${{ !cancelled() && (inputs.task == 'all' || inputs.task == 'record' || inputs.task == 'finish' || inputs.task == 'edit') }}
        run: |
          set -o pipefail
          [ -d /tmp/v4/raw-pack ] && cp -a /tmp/v4/raw-pack/. /tmp/v4/ || true
          ./docs/video/tools/v4/edit.sh "$OUT" 2>&1 | tee >(eval "$SAVE" > "$OUT/edit.log")
      - if: (inputs.task == 'all' || inputs.task == 'record' || inputs.task == 'finish' || inputs.task == 'edit') && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: dmw-video, path: '${{ env.OUT }}/*.mp4', retention-days: 30, if-no-files-found: ignore }

      # ---------------- results ----------------
      - name: Push the non-secret results to ci/testnet-results
        if: always()
        env:
          TASK_INPUT: ${{ inputs.task }}
        run: |
          ./scripts/ci/mask.sh
          # last line of defence: refuse to publish anything that looks like a private key
          if grep -rIl 'ed25519:[1-9A-HJ-NP-Za-km-z]\{80,\}' "$OUT" 2>/dev/null; then echo "a private key reached the results; not pushing"; exit 1; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv "$OUT" /tmp/results-out
          git fetch origin ci/testnet-results 2>/dev/null && git checkout -B ci/testnet-results origin/ci/testnet-results || git checkout --orphan ci/testnet-results
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name results -exec rm -rf {} +
          mkdir -p results && rm -rf "results/${{ github.run_id }}" && mv /tmp/results-out "results/${{ github.run_id }}"
          echo "$TASK_INPUT $(date -u +%FT%TZ) ${{ github.sha }}" > "results/${{ github.run_id }}/RUN.txt"
          git add -f results
          git commit -qm "results: $TASK_INPUT run ${{ github.run_id }}" && git push -q origin ci/testnet-results
