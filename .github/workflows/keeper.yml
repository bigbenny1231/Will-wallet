name: keeper

# The hosted keeper for the live testnet contract. Every 10 minutes a read-only check looks for vaults that are past
# their deadline or Triggered; when there is one, the keeper pokes it and runs its steps until nothing is due.
# It signs as the contract keeper: the long-lived account derived from the KEEPER_SEED repository secret
# (scripts/near-admin.mjs derive-keeper), the same account the deploy names in `new`. Its key exists only in that
# secret and in the runner's memory while a job runs. Details: keeper/README.md, "Hosted keeper".
on:
  schedule:
    # Every 10 minutes, a few minutes off the hour (the top of the hour is the busiest time for scheduled runs).
    - cron: '7-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One keeper at a time. A run that starts while another is going waits for it; it is not cancelled.
concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # keeper/src/config.ts reads the process environment first; there is no .env file on the runner.
      NEAR_NETWORK: testnet
      DMW_CONTRACT: ${{ vars.DMW_CONTRACT || 'dmw-885364.testnet' }}
      NEAR_RPC: ${{ vars.NEAR_RPC || 'https://rpc.testnet.fastnear.com' }}
      DMW_MOCK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: keeper/package-lock.json }
      - name: Install keeper dependencies
        working-directory: keeper
        run: npm ci

      # The site's showcase vault: one owner heartbeat a day keeps it Alive (scripts/ci/showcase-beat.sh).
      - name: Showcase heartbeat
        continue-on-error: true
        env:
          KEEPER_SEED: ${{ secrets.KEEPER_SEED }}
        run: ./scripts/ci/showcase-beat.sh

      # Read-only view call. Sets outputs `work` (true/false) and `count`. No account, no key, no transaction.
      - name: Check for vaults that are past their deadline or Triggered
        id: due
        working-directory: keeper
        run: npx tsx src/cli.ts due --github-output

      # A testnet.yml run (deploy or demo recording) drives its own vaults with the same keeper account; two signers
      # on one key would race for nonces, so the hosted keeper waits for the next slot.
      - name: Yield to a running testnet job
        id: free
        if: steps.due.outputs.work == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow testnet.yml --status in_progress --json databaseId -q 'length' || echo 0)
          if [ "${n:-0}" != 0 ]; then echo "a testnet run is in progress; the next keeper slot will pick these vaults up"; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - name: Keep
        if: steps.due.outputs.work == 'true' && steps.free.outputs.go == 'true'
        shell: bash
        env:
          # Secrets cannot be tested in `if:`, so the seed is passed in and checked here. An unset secret is empty.
          KEEPER_SEED: ${{ secrets.KEEPER_SEED }}
        run: |
          set -euo pipefail
          . scripts/lib.sh
          if [ "${#KEEPER_SEED}" -ge 32 ]; then
            name="$(node scripts/near-admin.mjs derive-keeper)"
            echo "keeper account: $name (derived from KEEPER_SEED)"
          else
            # Without the secret the keeper still works (poke and the steps are open to any account), only not as the
            # contract keeper, so step 3 waits out its first hour.
            echo "::warning::KEEPER_SEED is not set; keeping with a one-off faucet account instead of the contract keeper"
            name="dmw-sweep-$(openssl rand -hex 5).testnet"
            node scripts/near-admin.mjs create "$name"
          fi
          # Mask the private key (with and without its ed25519: prefix) before anything else runs.
          node -e 'const k = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).private_key; console.log("::add-mask::" + k); console.log("::add-mask::" + k.replace(/^ed25519:/, ""));' "keys/$name.json"
          for _ in $(seq 10); do account_exists "$name" && break; sleep 2; done
          [ "${#KEEPER_SEED}" -ge 32 ] && keeper_topup "$name"
          KEEPER_PRIVATE_KEY="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).private_key)' "keys/$name.json")"
          export KEEPER_ACCOUNT_ID="$name" KEEPER_PRIVATE_KEY
          cd keeper
          npx tsx src/cli.ts keeper --until-idle --max-seconds 480 --poll 5
