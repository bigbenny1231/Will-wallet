name: reproducible
# Checks on every push that touches the contract that `cargo near build reproducible-wasm` (the Docker image pinned in
# contracts/dmw/Cargo.toml) builds, and prints the code hash. The testnet workflow (task=all) makes the same build,
# commits it as contracts/release/dmw.wasm and deploys it.
on:
  push:
    paths: ['contracts/dmw/**', '.github/workflows/reproducible.yml', '.github/workflows/testnet.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: cargo-near 0.23.0
        run: |
          # pinned by sha256; the installer then checks the binary's own sha256
          curl --proto '=https' --tlsv1.2 -LsSf -o /tmp/cargo-near-installer.sh https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh
          echo "76ae71bc6a99864a09cc67c1c0bf82a2b7812d8ab4c93034b680235df6d22028  /tmp/cargo-near-installer.sh" | sha256sum -c -
          sh /tmp/cargo-near-installer.sh
          cargo near --version
      - name: Reproducible build
        working-directory: contracts/dmw
        run: |
          cargo near build reproducible-wasm
          ls -l target/near/dmw.wasm
          node -e 'const b=require("crypto").createHash("sha256").update(require("fs").readFileSync(process.argv[1])).digest();const A="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";let n=BigInt("0x"+b.toString("hex")),s="";while(n>0n){s=A[Number(n%58n)]+s;n/=58n}for(const x of b){if(x!==0)break;s="1"+s}console.log("code hash",s)' target/near/dmw.wasm
