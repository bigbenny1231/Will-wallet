[package]
name = "dmw"
description = "Lastword: heartbeat-triggered inheritance vaults as Will NFTs on NEAR"
version = "0.1.0"
edition = "2021"
license = "MIT"
# NEP-330: exposed by the `contract_source_metadata` view as `link`
repository = "https://github.com/bigbenny1231/will-wallet"

[lib]
crate-type = ["cdylib", "rlib"]


# NEP-330 reproducible build: `cargo near build reproducible-wasm` (needs Docker) builds the
# committed tree inside this pinned image, so anyone gets the same code hash for the same commit.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.99.1"
image_digest = "sha256:8013f039e8005627f10ae66b5519d1a6eeeed7d7aef4b5067d5e9a86c4302fcc"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30.1"
serde_json = "1"
near-contract-standards = "5.30.1"
# step 3 chain signatures (src/foreign.rs); 0.3 has no `solana` feature
omni-transaction = { version = "0.5.0", default-features = false, features = ["evm", "solana"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
