[package]
name = "dmw"
description = "Dead Man's Wallet: heartbeat-triggered inheritance vaults as Will NFTs on NEAR"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
near-sdk = "5.30.1"
serde_json = "1"
near-contract-standards = "5.30.1"
# step 3 chain signatures (src/foreign.rs); 0.3 has no `solana` feature
omni-transaction = { version = "0.5.0", default-features = false, features = ["evm", "solana"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
