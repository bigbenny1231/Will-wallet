[package]
name = "evil-dao"
description = "Test-only attacker contract for finding C-2 (docs/SECURITY_REVIEW_3.md): keeps the add_proposal deposit and returns a promise that fails. Never deploy outside testnet."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
